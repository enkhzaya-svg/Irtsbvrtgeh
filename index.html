<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супер Хүний Нөөцийн Систем</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS (Excel файл унших болон Үүсгэх) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
        .file-drop { border: 2px dashed #cbd5e1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .file-drop.active { border-color: #10b981; background-color: #ecfdf5; }
        .file-drop:hover:not(.active) { border-color: #3b82f6; background-color: #eff6ff; }
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .sticky-col-left { position: sticky; left: 0; z-index: 20; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); }
        .sticky-col-right { position: sticky; right: 0; z-index: 20; box-shadow: -2px 0 5px -2px rgba(0,0,0,0.1); }
        
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .animate-scale-up { animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Хэвлэх үеийн тохиргоо */
        @media print {
            body * { visibility: hidden !important; }
            #print-area, #print-area * { visibility: visible !important; }
            #print-area { position: absolute !important; left: 0; top: 0; width: 100vw !important; height: auto !important; background: white; margin: 0; padding: 20px; box-sizing: border-box; box-shadow: none !important; }
            .no-print { display: none !important; }
            .custom-scrollbar { overflow: visible !important; max-height: none !important; }
            .glass-card, .fixed, .absolute, .inset-0, .shadow-2xl { position: static !important; box-shadow: none !important; transform: none !important; }
            .print-signature-area { display: flex !important; justify-content: space-between; margin-top: 50px; padding-top: 20px; border-top: 1px solid #cbd5e1; }
            table { width: 100% !important; border-collapse: collapse !important; }
            th, td { border: 1px solid #e2e8f0 !important; padding: 8px !important; }
            /* Hide the close button and print/export buttons when printing */
            #print-header-actions { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const parseDuration = (durationStr) => {
            if (!durationStr) return 0;
            const match = String(durationStr).match(/(\d+)h\s*(\d+)m/);
            if (match) {
                return parseInt(match[1]) + (parseInt(match[2]) / 60);
            }
            const num = parseFloat(durationStr);
            return isNaN(num) ? 0 : num;
        };

        const calculateHoursDiff = (timeIn, timeOut) => {
            if (!timeIn || !timeOut || String(timeIn).includes('--') || String(timeOut).includes('--')) return 0;
            try {
                const [inH, inM] = String(timeIn).split(':').map(Number);
                const [outH, outM] = String(timeOut).split(':').map(Number);
                if (isNaN(inH) || isNaN(outH)) return 0;
                let diff = (outH + (outM || 0) / 60) - (inH + (inM || 0) / 60);
                return diff > 0 ? diff : 0;
            } catch(e) {
                return 0;
            }
        };

        // Хоцролт бодох функц
        const calculateLateness = (timeIn, threshold) => {
            if (!timeIn || !threshold || String(timeIn).includes('--')) return 0;
            try {
                const [inH, inM] = String(timeIn).split(':').map(Number);
                const [thH, thM] = String(threshold).split(':').map(Number);
                if (isNaN(inH) || isNaN(thH)) return 0;
                
                const inMins = inH * 60 + (inM || 0);
                const thMins = thH * 60 + (thM || 0);
                
                return inMins > thMins ? (inMins - thMins) : 0;
            } catch(e) {
                return 0;
            }
        };

        const getBaseName = (name) => {
            if (!name) return "Тодорхойгүй";
            return String(name).split(' ')[0].trim().toUpperCase();
        };

        const formatMoney = (amount) => {
            return new Intl.NumberFormat('mn-MN').format(Math.round(amount)) + " ₮";
        };

        const formatTimeForInput = (t) => {
            if (!t || String(t).includes('--')) return "";
            return String(t).substring(0, 5); 
        };

        function App() {
            const [attendanceData, setAttendanceData] = useState([]);
            const [requestData, setRequestData] = useState([]);
            const [attendanceFileName, setAttendanceFileName] = useState("");
            const [requestFileName, setRequestFileName] = useState("");
            
            // Сарын цалингийн тохиргоонууд
            const [defaultMonthlySalary, setDefaultMonthlySalary] = useState(1500000);
            const [monthlyTargetHours, setMonthlyTargetHours] = useState(168); 
            const [standardHours, setStandardHours] = useState(8); 
            const [lateThreshold, setLateThreshold] = useState("09:00");
            
            // Илүү цагийн тусгай тохиргоонууд
            const [otTimeAction, setOtTimeAction] = useState(1); 
            const [otSalaryAction, setOtSalaryAction] = useState(1); 
            const [overtimeMultiplier, setOvertimeMultiplier] = useState(1.5);
            
            const [isCalculated, setIsCalculated] = useState(false);
            const [approvedIds, setApprovedIds] = useState(new Set());
            const [customSalaries, setCustomSalaries] = useState({});
            
            const [manualTimeFixes, setManualTimeFixes] = useState({}); 
            const [manualOtFixes, setManualOtFixes] = useState({}); 
            const [typeActions, setTypeActions] = useState({}); 
            const [individualReqActions, setIndividualReqActions] = useState({}); 
            
            // Задаргаанаас хассан (устгасан) бичлэгүүдийг хадгалах State
            const [excludedEntries, setExcludedEntries] = useState(new Set());
            
            // Модалын төлөвүүд
            const [modalData, setModalData] = useState(null); 
            const [modalTimeIn, setModalTimeIn] = useState("");
            const [modalTimeOut, setModalTimeOut] = useState("");
            
            const [pendingModalData, setPendingModalData] = useState(null); 
            const [cellModalData, setCellModalData] = useState(null); 
            const [otEdits, setOtEdits] = useState({}); 

            const handleFileUpload = (e, setData, setFileName) => {
                const file = e.target.files[0];
                if (!file) return;
                
                setFileName(file.name);
                setIsCalculated(false); 
                
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const data = new Uint8Array(evt.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const wsname = wb.SheetNames[0];
                    const ws = wb.Sheets[wsname];
                    const jsonData = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });
                    setData(jsonData);
                };
                reader.readAsArrayBuffer(file);
            };

            const handleCalculateClick = () => {
                if (attendanceData.length === 0 && requestData.length === 0) {
                    alert("Ирцийн эсвэл хүсэлтийн файлаа оруулна уу.");
                    return;
                }
                setIsCalculated(true);
            };

            const handleApprove = (id) => {
                setApprovedIds(prev => {
                    const newSet = new Set(prev);
                    newSet.add(id);
                    return newSet;
                });
            };

            const handleSalaryChange = (name, val) => {
                const num = parseInt(val.replace(/,/g, ''));
                setCustomSalaries(prev => ({
                    ...prev,
                    [name]: isNaN(num) ? "" : num
                }));
            };

            // Хасах/Сэргээх үйлдэл
            const toggleExclude = (id) => {
                setExcludedEntries(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const openModal = (empRow, date, reason) => {
                const relatedRequests = empRow.allRequests.filter(r => r.date === date);
                const rawTimes = empRow.daily[date]?.rawTimes || { in: "", out: "" };
                
                setModalTimeIn(formatTimeForInput(rawTimes.in));
                setModalTimeOut(formatTimeForInput(rawTimes.out));

                setModalData({ empName: empRow.name, date, reason, requests: relatedRequests, rawTimes });
            };

            const openCellModal = (empRow, cellType) => {
                if (cellType === 'Илүү цаг') {
                    let initialEdits = {};
                    Object.entries(empRow.daily).forEach(([date, dayData]) => {
                        if (dayData.originalOffice > 0 || dayData.reqs > 0 || dayData.actualOvertime > 0) {
                            initialEdits[date] = dayData.actualOvertime || 0;
                        }
                    });
                    setOtEdits(initialEdits);
                }
                setCellModalData({ empName: empRow.name, type: cellType });
            };

            const saveManualTime = () => {
                if (!modalData) return;
                const fixKey = `${modalData.empName}_${modalData.date}`;
                setManualTimeFixes(prev => ({
                    ...prev,
                    [fixKey]: { timeIn: modalTimeIn, timeOut: modalTimeOut }
                }));
                setModalData(null); 
            };
            
            const saveOvertimeFixes = () => {
                if (!cellModalData) return;
                const newOtFixes = { ...manualOtFixes };
                Object.entries(otEdits).forEach(([date, val]) => {
                    newOtFixes[`${cellModalData.empName}_${date}`] = parseFloat(val) || 0;
                });
                setManualOtFixes(newOtFixes);
                setCellModalData(null);
            };

            const availableTypes = useMemo(() => {
                const types = new Set();
                requestData.forEach(row => {
                    const type = row['Partner type'] || row['Partner Type'] || row['Төрөл'] || row['Type'];
                    if (type) types.add(String(type).trim());
                });
                return Array.from(types).sort();
            }, [requestData]);

            useEffect(() => {
                setTypeActions(prev => {
                    const next = { ...prev };
                    availableTypes.forEach(t => {
                        if (next[t] === undefined) {
                            next[t] = 0; 
                        }
                    });
                    return next;
                });
            }, [availableTypes]);

            useEffect(() => {
                const handleEsc = (e) => {
                    if (e.key === 'Escape') {
                        setModalData(null);
                        setPendingModalData(null);
                        setCellModalData(null);
                    }
                };
                window.addEventListener('keydown', handleEsc);
                return () => window.removeEventListener('keydown', handleEsc);
            }, []);

            // Үндсэн тооцоолол (excludedEntries-ийг тооцно)
            const { dynamicTypes, finalResults, summary } = useMemo(() => {
                if (!isCalculated) return { dynamicTypes: [], finalResults: [], summary: {} };

                const emps = {};
                const typesSet = new Set();

                const getEmp = (name) => {
                    if (!emps[name]) {
                        emps[name] = {
                            name,
                            totalOffice: 0,
                            types: {},
                            pending: [],
                            missing: new Map(), 
                            daily: {},
                            overtime: 0,
                            totalLateness: 0, 
                            totalEffective: 0,
                            salary: 0,
                            allRequests: [] 
                        };
                    }
                    return emps[name];
                };

                // 1. ИРЦИЙН ӨГӨГДӨЛ
                attendanceData.forEach((row) => {
                    const rawName = row['Employee'] || row['Нэр'] || row['employee'];
                    const date = String(row['Огноо'] || row['Date'] || row['date'] || "");
                    
                    if (!rawName || !date) return;
                    
                    const name = getBaseName(rawName);
                    const emp = getEmp(name);
                    const fixKey = `${name}_${date}`;
                    
                    let timeIn = row['Ирсэн'] || row['Time in'];
                    let timeOut = row['Явсан'] || row['Time out'];
                    let hours = parseFloat(row['Нийт цаг'] || row['Нийт_цаг']);

                    if (manualTimeFixes[fixKey]) {
                        timeIn = manualTimeFixes[fixKey].timeIn || timeIn;
                        timeOut = manualTimeFixes[fixKey].timeOut || timeOut;
                        hours = calculateHoursDiff(timeIn, timeOut);
                    } else if (isNaN(hours) || hours === 0) {
                        hours = calculateHoursDiff(timeIn, timeOut);
                    }

                    const officeId = `office_${emp.name}_${date}`;
                    const isOfficeExcluded = excludedEntries.has(officeId);
                    const effectiveOfficeHours = isOfficeExcluded ? 0 : hours;
                    
                    const lateMins = calculateLateness(timeIn, lateThreshold);
                    emp.totalLateness += lateMins;
                    
                    emp.totalOffice += effectiveOfficeHours;
                    
                    if (!emp.daily[date]) {
                        emp.daily[date] = { 
                            office: effectiveOfficeHours, 
                            originalOffice: hours, 
                            officeId: officeId,
                            reqs: 0, 
                            effectiveReqs: 0, 
                            lateness: lateMins, 
                            rawTimes: { in: timeIn, out: timeOut } 
                        };
                    } else {
                        emp.daily[date].office += effectiveOfficeHours;
                        emp.daily[date].originalOffice = (emp.daily[date].originalOffice || 0) + hours;
                        emp.daily[date].officeId = officeId;
                        emp.daily[date].lateness = lateMins;
                        emp.daily[date].rawTimes = { in: timeIn, out: timeOut };
                    }
                    
                    const hasNoIn = !timeIn || String(timeIn).includes('--');
                    const hasNoOut = !timeOut || String(timeOut).includes('--');
                    
                    let missingReason = "";
                    if (hasNoIn && hasNoOut) missingReason = "Ирц дараагүй";
                    else if (hasNoIn) missingReason = "Ирэх цаг дараагүй";
                    else if (hasNoOut) missingReason = "Явах цаг дараагүй";
                    else if (hours <= 0) missingReason = "Цаг бодогдоогүй";

                    if (missingReason) {
                        emp.missing.set(date, missingReason);
                    }
                });

                // 2. ХҮСЭЛТИЙН ӨГӨГДӨЛ
                requestData.forEach((row, index) => {
                    const rawName = row['Нэр'] || row['Employee'] || row['Employee Name'] || row['Partner name'];
                    const date = String(row['Эхлэх хугацаа'] || row['Start date'] || row['Starting time'] || "");
                    const type = row['Partner type'] || row['Partner Type'] || row['Төрөл'] || row['Type'];
                    const durationStr = row['Хугацаа'] || row['Duration'];
                    const statusStr = String(row['Төлөв'] || row['Status'] || row['State'] || "").toLowerCase();
                    const description = row['Description'] || row['Тайлбар'] || row['Тайлбар/Шалтгаан'] || "";
                    
                    if (!rawName || !date || !type) return;
                    if (statusStr.includes("цуцалсан") || statusStr.includes("cancel") || statusStr.includes("reject")) return;

                    const name = getBaseName(rawName);
                    const emp = getEmp(name);
                    const typeClean = String(type).trim();
                    typesSet.add(typeClean);
                    
                    let startH = row['Эхлэх цаг'] || row['Starting hour'] || "";
                    let endH = row['Дуусах цаг'] || row['End hour'] || "";
                    
                    let duration = parseDuration(durationStr);
                    if (duration === 0) {
                        duration = calculateHoursDiff(startH, endH);
                    }

                    const reqId = `${name}_${date}_${index}`;
                    const isPending = statusStr.includes("илгээсэн") || statusStr.includes("sent") || statusStr.includes("pending");
                    const isApprovedLocally = approvedIds.has(reqId);
                    const isEffectivelyPending = isPending && !isApprovedLocally;
                    const isReqExcluded = excludedEntries.has(reqId);
                    
                    emp.allRequests.push({ 
                        id: reqId, date, type: typeClean, 
                        durationStr: durationStr || `${duration}h`, duration, 
                        isPending: isEffectivelyPending,
                        startH, endH, description 
                    });

                    if (isEffectivelyPending) {
                        emp.pending.push({ id: reqId, date, type: typeClean, durationStr: durationStr || `${duration}h`, duration, startH, endH, description });
                    } else {
                        if (!isReqExcluded) {
                            emp.types[typeClean] = (emp.types[typeClean] || 0) + duration;
                        }
                        
                        const action = individualReqActions[reqId] !== undefined ? individualReqActions[reqId] : (typeActions[typeClean] !== undefined ? typeActions[typeClean] : 0);
                        const effectiveDuration = isReqExcluded ? 0 : (duration * action);
                        const physicalDuration = isReqExcluded ? 0 : duration;

                        if (!emp.daily[date]) {
                            emp.daily[date] = { office: 0, originalOffice: 0, reqs: physicalDuration, effectiveReqs: effectiveDuration, lateness: 0, rawTimes: {in: "", out: ""} };
                        } else {
                            emp.daily[date].reqs = (emp.daily[date].reqs || 0) + physicalDuration;
                            emp.daily[date].effectiveReqs = (emp.daily[date].effectiveReqs || 0) + effectiveDuration;
                        }
                        
                        if (emp.missing.has(date) && duration >= standardHours / 2) {
                            emp.missing.delete(date);
                        }
                    }
                });

                // 3. Цалин, Илүү цаг, Нийт цаг
                let totalCompanySalary = 0;
                let totalCompanyHours = 0;

                Object.values(emps).forEach(emp => {
                    Object.entries(emp.daily).forEach(([date, day]) => {
                        const totalDay = (day.office || 0) + (day.effectiveReqs || 0);
                        
                        let autoOt = totalDay > standardHours ? (totalDay - standardHours) : 0;
                        day.autoOvertime = autoOt;
                        
                        const otFixKey = `${emp.name}_${date}`;
                        if (manualOtFixes[otFixKey] !== undefined) {
                            day.actualOvertime = parseFloat(manualOtFixes[otFixKey]) || 0;
                        } else {
                            day.actualOvertime = autoOt;
                        }
                        
                        emp.overtime += day.actualOvertime;
                    });
                    
                    let reqTotal = 0;
                    emp.allRequests.forEach(r => {
                        if (!r.isPending && !excludedEntries.has(r.id)) {
                            const action = individualReqActions[r.id] !== undefined ? individualReqActions[r.id] : (typeActions[r.type] !== undefined ? typeActions[r.type] : 0);
                            reqTotal += (r.duration * action);
                        }
                    });
                    
                    emp.totalEffective = emp.totalOffice + reqTotal;
                    emp.totalEffective += (otTimeAction - 1) * emp.overtime;
                    emp.totalEffective = Math.max(0, emp.totalEffective);

                    const monthlySalary = customSalaries[emp.name] !== undefined && customSalaries[emp.name] !== "" ? parseFloat(customSalaries[emp.name]) : defaultMonthlySalary;
                    const hourlyWage = monthlyTargetHours > 0 ? (monthlySalary / monthlyTargetHours) : 0;
                    
                    const baseSalary = emp.totalEffective * hourlyWage;
                    
                    let overtimeBonus = 0;
                    if (otSalaryAction === 1) {
                        overtimeBonus = (emp.overtime * hourlyWage * overtimeMultiplier) - (emp.overtime * hourlyWage * otTimeAction);
                    } else {
                        overtimeBonus = - (emp.overtime * hourlyWage * Math.max(0, otTimeAction));
                    }
                    
                    emp.salary = baseSalary + overtimeBonus;
                    totalCompanySalary += emp.salary;
                    totalCompanyHours += emp.totalEffective;
                });

                const dTypes = Array.from(typesSet).sort();
                const fResults = Object.values(emps).sort((a, b) => a.name.localeCompare(b.name));

                return { 
                    dynamicTypes: dTypes, 
                    finalResults: fResults,
                    summary: {
                        employees: fResults.length,
                        hours: totalCompanyHours.toFixed(1),
                        salary: totalCompanySalary
                    }
                };
            }, [isCalculated, attendanceData, requestData, approvedIds, standardHours, lateThreshold, defaultMonthlySalary, monthlyTargetHours, overtimeMultiplier, customSalaries, manualTimeFixes, manualOtFixes, typeActions, individualReqActions, otTimeAction, otSalaryAction, excludedEntries]);

            // Excel (.xlsx) Шууд Татах функц (Үндсэн тайлан)
            const exportToExcel = () => {
                if (!finalResults || finalResults.length === 0) return;
                
                const exportData = finalResults.map(row => {
                    const mSalary = customSalaries[row.name] !== undefined && customSalaries[row.name] !== "" ? customSalaries[row.name] : defaultMonthlySalary;
                    const missingArr = Array.from(row.missing.entries()).map(([d, reason]) => `${d} (${reason})`).join("; ");
                    const pendingArr = row.pending.map(p => `${p.date}: ${p.type} (${p.durationStr})`).join("; ");

                    let rowData = {
                        "Ажилтан": row.name,
                        "Сарын үндсэн цалин (₮)": mSalary,
                        "Сард ажиллах норм (цаг)": monthlyTargetHours,
                        "Оффист ажилласан (цаг)": Number(row.totalOffice.toFixed(2))
                    };

                    dynamicTypes.forEach(t => {
                        rowData[`${t} (цаг)`] = Number((row.types[t] || 0).toFixed(2));
                    });

                    rowData["Нийт хүчинтэй цаг (цаг)"] = Number(row.totalEffective.toFixed(2));
                    rowData["Илүү цаг (цаг)"] = Number(row.overtime.toFixed(2));
                    rowData["Хоцролт (минут)"] = row.totalLateness;
                    rowData["ОЛГОХ ЦАЛИН (₮)"] = Math.round(row.salary);
                    rowData["Анхаарах өдрүүд (Дутуу ирц)"] = missingArr;
                    rowData["Батлаагүй үлдсэн хүсэлт"] = pendingArr;

                    return rowData;
                });
                
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Цалингийн тайлан");
                XLSX.writeFile(wb, "Цалингийн_Дэлгэрэнгүй_Тайлан.xlsx");
            };

            const printModal = () => {
                window.print();
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-[1600px] mx-auto relative">
                    <header className="mb-10 text-center animate-slide-up no-print">
                        <div className="inline-flex items-center justify-center p-3 bg-blue-600 rounded-2xl shadow-lg shadow-blue-500/30 mb-4 text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>
                            </svg>
                        </div>
                        <h1 className="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-indigo-700 tracking-tight">

                            });

                                modalDetails.push({ id: null, date: 'Тохиргоо', start: '-', end: '-', duration: otAdjustment, originalDuration: otAdjustment, desc: `Илүү цагийг нийт цагт ${otTimeAction === 0 ? 'оруулаагүй (хассан)' : 'торгууль болгон хассан'}`, isExcluded: false });

                            const exportData = modalDetails.map(d => {
                                let row = {
                                    "Огноо": d.date === 'Тохиргоо' ? 'Тохиргоо' : (d.date.length > 5 && d.date.includes('-') ? d.date.substring(5) : d.date)

                                    row["Явсан/Дуусах"] = d.end;
                                    row["Тайлбар"] = d.desc;
                                    row["Үргэлжлэх цаг"] = Number((d.isExcluded ? 0 : (d.duration || 0)).toFixed(2));
                                    row["Төлөв"] = d.isExcluded ? 'Хассан' : 'Тооцсон';
                                }
                                return row;

                            const ws = XLSX.utils.json_to_sheet(exportData);
                            const wb = XLSX.utils.book_new();
                            XLSX.utils.book_append_sheet(wb, ws, "Задаргаа");
                            XLSX.writeFile(wb, `${cellModalData.empName}_${cellModalData.type}_задаргаа.xlsx`);
                        };

                        return (

                                                🖨️ Хэвлэх
                                            </button>
                                            <button onClick={exportModalToExcel} className="text-sm font-bold text-emerald-700 bg-emerald-100 hover:bg-emerald-200 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors" title="Энэ задаргааг Excel файлаар татах">
                                                📊 Excel татах
                                            </button>
                                            <button onClick={() => setCellModalData(null)} className="text-slate-400 hover:text-slate-700 hover:bg-slate-100 p-1.5 rounded-lg transition-colors ml-2">

                                            </button>
                                        </div>
                                    </div>
                                    
                                    {/* Хэвлэх үед харагдах толгой хэсэг */}
                                    <div className="hidden print:block mb-6 text-center">
                                        <h2 className="text-2xl font-bold text-black uppercase">{cellModalData.type === 'Нийт' ? 'Нийт ажилласан цагийн дэлгэрэнгүй тайлан' : `${cellModalData.type} тайлан`}</h2>
                                        <p className="text-gray-600 mt-2">Хэвлэсэн огноо: {new Date().toLocaleDateString('mn-MN')}</p>
                                    </div>
                                    
                                    <div className="mb-4 flex flex-wrap gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100 print:bg-white print:border-gray-300 print:rounded-none">
                                        <div>
                                            <span className="text-xs text-slate-500 font-medium block">Ажилтан</span>
                                            <span className="text-sm font-bold text-slate-800">{cellModalData.empName}</span>
                                        </div>
                                        <div className="w-px bg-slate-200 print:bg-gray-300"></div>
                                        <div>
                                            <span className="text-xs text-slate-500 font-medium block">Төрөл</span>
                                            <span className="text-sm font-bold text-indigo-700 print:text-black">{cellModalData.type}</span>
                                        </div>
                                        <div className="w-px bg-slate-200 print:bg-gray-300"></div>
                                        <div>
                                            <span className="text-xs text-slate-500 font-medium block">Нийт бичлэг</span>
                                            <span className="text-sm font-bold text-slate-800">{modalDetails.length}</span>
                                        </div>
                                    </div>

                                    {modalDetails.length === 0 ? (
                                        <div className="flex justify-center p-8 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                                            <span className="text-slate-400 font-medium">Мэдээлэл олдсонгүй.</span>
                                        </div>
                                    ) : (
                                        <div className="overflow-x-auto max-h-[400px] custom-scrollbar border border-slate-200 rounded-xl print:max-h-none print:overflow-visible print:border-none print:rounded-none">
                                            {cellModalData.type === 'Илүү цаг' ? (
                                                <table className="w-full text-left border-collapse print:border-gray-300">
                                                    <thead>
                                                        <tr className="bg-emerald-50 text-emerald-800 text-xs uppercase sticky top-0 shadow-sm print:bg-gray-100 print:text-black print:static print:shadow-none">
                                                            <th className="p-3 font-bold print:border">Огноо</th>
                                                            <th className="p-3 font-bold text-center print:border">Ирсэн / Явсан</th>
                                                            <th className="p-3 font-bold text-center print:border">Систем бодсон (цаг)</th>
                                                            <th className="p-3 font-bold text-center bg-emerald-100 print:bg-gray-100 print:border">Олгох илүү цаг</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="text-sm divide-y divide-slate-100 print:divide-gray-300">
                                                        {modalDetails.map((d, i) => (
                                                            <tr key={i} className="hover:bg-slate-50 print:hover:bg-white">
                                                                <td className="p-3 font-bold text-slate-800 print:border">{d.date.length > 5 && d.date.includes('-') ? d.date.substring(5) : d.date}</td>
                                                                <td className="p-3 text-center text-slate-600 font-medium print:border">{d.start} - {d.end}</td>
                                                                <td className="p-3 text-center text-slate-500 font-medium print:border">{d.autoOt.toFixed(2)}</td>
                                                                <td className="p-3 text-center bg-emerald-50/50 print:bg-white print:border">
                                                                    <input 
                                                                        type="number" 
                                                                        step="0.5" 
                                                                        className="w-20 px-2 py-1.5 text-center text-sm font-bold text-emerald-700 border border-emerald-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white print:border-none print:p-0 print:text-black"
                                                                        value={otEdits[d.date] !== undefined ? otEdits[d.date] : ''}
                                                                        onChange={(e) => setOtEdits({...otEdits, [d.date]: e.target.value})}
                                                                        placeholder="0"
                                                                    />
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                    <tfoot className="bg-slate-50 sticky bottom-0 border-t border-slate-200 print:static print:bg-gray-100">
                                                        <tr>
                                                            <td colSpan="3" className="p-3 text-right font-bold text-slate-600 uppercase text-xs print:border print:text-black">Нийт олгох:</td>
                                                            <td className="p-3 text-center font-black text-emerald-600 text-base print:border print:text-black">
                                                                {Object.values(otEdits).reduce((sum, val) => sum + (parseFloat(val) || 0), 0).toFixed(2)}
                                                            </td>
                                                        </tr>
                                                    </tfoot>
                                                </table>
                                            ) : cellModalData.type === 'Хоцролт' ? (
                                                <table className="w-full text-left border-collapse print:border-gray-300">
                                                    <thead>
                                                        <tr className="bg-rose-50 text-rose-800 text-xs uppercase sticky top-0 shadow-sm print:bg-gray-100 print:text-black print:static print:shadow-none">
                                                            <th className="p-3 font-bold print:border">Огноо</th>
                                                            <th className="p-3 font-bold text-center print:border">Ирсэн цаг</th>
                                                            <th className="p-3 font-bold text-center print:border">Тооцох цаг</th>
                                                            <th className="p-3 font-bold text-right print:border">Хоцролт (минут)</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="text-sm divide-y divide-slate-100 print:divide-gray-300">
                                                        {modalDetails.map((d, i) => (
                                                            <tr key={i} className="hover:bg-slate-50 print:hover:bg-white">
                                                                <td className="p-3 font-bold text-slate-800 print:border">{d.date.length > 5 && d.date.includes('-') ? d.date.substring(5) : d.date}</td>
                                                                <td className="p-3 text-center text-rose-600 font-black print:border print:text-black">{d.start}</td>
                                                                <td className="p-3 text-center text-slate-500 font-medium print:border">{d.end}</td>
                                                                <td className="p-3 text-right font-bold text-rose-600 print:border print:text-black">{d.duration} мин</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                    <tfoot className="bg-slate-50 sticky bottom-0 border-t border-slate-200 print:static print:bg-gray-100">
                                                        <tr>
                                                            <td colSpan="3" className="p-3 text-right font-bold text-slate-600 uppercase text-xs print:border print:text-black">Нийт хоцролт:</td>
                                                            <td className="p-3 text-right font-black text-rose-700 text-base print:border print:text-black">
                                                                {modalDetails.reduce((sum, item) => sum + item.duration, 0)} мин
                                                            </td>
                                                        </tr>
                                                    </tfoot>
                                                </table>
                                            ) : (
                                                <table className="w-full text-left border-collapse print:border-gray-300">
                                                    <thead>
                                                        <tr className="bg-slate-100 text-slate-600 text-xs uppercase sticky top-0 shadow-sm print:bg-gray-100 print:text-black print:static print:shadow-none">
                                                            <th className="p-3 font-bold print:border">Огноо</th>
                                                            <th className="p-3 font-bold text-center print:border">Ирсэн / Эхлэх</th>
                                                            <th className="p-3 font-bold text-center print:border">Явсан / Дуусах</th>
                                                            <th className="p-3 font-bold text-right print:border">Үргэлжлэх (Цаг)</th>
                                                            <th className="p-3 font-bold min-w-[200px] print:border">Тайлбар</th>
                                                            <th className="p-3 font-bold text-center no-print w-[80px]">Үйлдэл</th>
                                                            {cellModalData.type !== 'Оффист' && cellModalData.type !== 'Нийт' && (
                                                                <th className="p-3 font-bold text-center min-w-[150px] no-print">Тохиргоо (Нийт цагт)</th>
                                                            )}
                                                        </tr>
                                                    </thead>
                                                    <tbody className="text-sm divide-y divide-slate-100 print:divide-gray-300">
                                                        {modalDetails.map((d, i) => (
                                                            <tr key={i} className={`hover:bg-slate-50 transition-colors ${d.isExcluded ? 'bg-slate-50 opacity-60 print:opacity-100' : ''} print:hover:bg-white`}>
                                                                <td className="p-3 font-bold text-slate-800 print:border">{d.date.length > 5 && d.date.includes('-') ? d.date.substring(5) : d.date}</td>
                                                                <td className="p-3 text-center text-slate-600 font-medium print:border">{d.start}</td>
                                                                <td className="p-3 text-center text-slate-600 font-medium print:border">{d.end}</td>
                                                                <td className="p-3 text-right print:border">
                                                                    {d.isExcluded ? (
                                                                        <span className="line-through text-slate-400 font-medium print:line-through print:text-gray-500">{d.originalDuration.toFixed(2)}</span>
                                                                    ) : (
                                                                        <span className="font-bold text-indigo-600 print:text-black">{d.duration.toFixed(2)}</span>
                                                                    )}
                                                                </td>
                                                                <td className="p-3 text-slate-600 text-xs print:border">{d.desc}</td>
                                                                
                                                                {/* Хасах/Сэргээх товч (Шинэ) */}
                                                                <td className="p-3 text-center no-print">
                                                                    {d.id && d.date !== 'Тохиргоо' ? (
                                                                        <button 
                                                                            onClick={() => toggleExclude(d.id)} 
                                                                            className={`text-[10px] font-bold px-2 py-1 rounded transition-colors ${d.isExcluded ? 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200' : 'bg-rose-100 text-rose-700 hover:bg-rose-200'}`}
                                                                        >
                                                                            {d.isExcluded ? 'Сэргээх' : 'Хасах'}
                                                                        </button>
                                                                    ) : <span className="text-slate-300">-</span>}
                                                                </td>

                                                                {cellModalData.type !== 'Оффист' && cellModalData.type !== 'Нийт' && (
                                                                    <td className="p-3 text-center no-print">
                                                                        {d.id ? (
                                                                            <select
                                                                                value={individualReqActions[d.id] !== undefined ? individualReqActions[d.id] : ""}
                                                                                onChange={(e) => {
                                                                                    const val = e.target.value;
                                                                                    const newActions = {...individualReqActions};
                                                                                    if (val === "") delete newActions[d.id];
                                                                                    else newActions[d.id] = Number(val);
                                                                                    setIndividualReqActions(newActions);
                                                                                }}
                                                                                className="w-full text-xs font-bold p-1.5 rounded border border-slate-300 focus:ring-2 focus:ring-blue-500 bg-white text-slate-700"
                                                                                disabled={d.isExcluded}
                                                                            >
                                                                                <option value="">Үндсэн ({typeActions[d.type] === 1 ? '+Нэмнэ' : typeActions[d.type] === -1 ? '-Хасна' : 'Оруулахгүй'})</option>
                                                                                <option value="1">➕ Нэмэх</option>
                                                                                <option value="0">⚪ Оруулахгүй</option>
                                                                                <option value="-1">➖ Хасах</option>
                                                                            </select>
                                                                        ) : <span className="text-slate-400">-</span>}
                                                                    </td>
                                                                )}
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                    <tfoot className="bg-slate-50 sticky bottom-0 border-t border-slate-200 print:static print:bg-gray-100">
                                                        <tr>
                                                            <td colSpan="3" className="p-3 text-right font-bold text-slate-600 uppercase text-xs print:border print:text-black">Нийт:</td>
                                                            <td className="p-3 text-right font-black text-indigo-700 text-base print:border print:text-black">
                                                                {cellModalData.type === 'Нийт' 
                                                                    ? activeEmp.totalEffective.toFixed(2)
                                                                    : modalDetails.reduce((sum, item) => sum + (item.duration || 0), 0).toFixed(2)}
                                                            </td>
                                                            <td className="print:border" colSpan={cellModalData.type !== 'Оффист' && cellModalData.type !== 'Нийт' ? "3" : "2"}></td>
                                                        </tr>
                                                    </tfoot>
                                                </table>
                                            )}
                                        </div>
                                    )}
                                    
                                    {/* Гарын үсэг зурах хэсэг (Зөвхөн хэвлэх үед харагдана) */}
                                    <div className="hidden print-signature-area">
                                        <div className="text-center">
                                            <p className="font-bold text-sm mb-10">Бэлтгэсэн (Хүний нөөц):</p>
                                            <p className="border-t border-black w-48 mx-auto pt-2">/ Гарын үсэг /</p>
                                        </div>
                                        <div className="text-center">
                                            <p className="font-bold text-sm mb-10">Тайлантай танилцсан (Ажилтан):</p>
                                            <p className="border-t border-black w-48 mx-auto pt-2">/ Гарын үсэг /</p>
                                        </div>
                                        <div className="text-center">
                                            <p className="font-bold text-sm mb-10">Хянасан (Удирдлага):</p>
                                            <p className="border-t border-black w-48 mx-auto pt-2">/ Гарын үсэг /</p>
                                        </div>
                                    </div>
                                    
                                    <div className="mt-6 pt-4 border-t border-slate-100 flex justify-end gap-3 no-print">
                                        <button onClick={() => setCellModalData(null)} className="bg-slate-100 text-slate-700 px-6 py-2.5 rounded-xl text-sm font-bold hover:bg-slate-200 transition-transform">
                                            Хаах
                                        </button>
                                        {cellModalData.type === 'Илүү цаг' && (
                                            <button 
                                                onClick={saveOvertimeFixes} 
                                                className="bg-emerald-500 text-white px-6 py-2.5 rounded-xl text-sm font-bold hover:bg-emerald-600 transition-transform transform hover:scale-105 flex items-center gap-2 shadow-lg shadow-emerald-500/30"
                                            >
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                                Хадгалах
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
